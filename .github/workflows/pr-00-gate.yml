# -----------------------------------------------------------------------------
# Gate Workflow — Consumer Repository Template
# -----------------------------------------------------------------------------
# Orchestrates CI enforcement for pull requests. The `summary` job aggregates
# results and publishes the commit status that keepalive automation relies on.
#
# USAGE:
#   - Standard Python projects: Use this template as-is
#   - Custom projects: Use as a STARTING POINT, customize the test job(s)
#
# IMPORTANT: The `summary` job and `Gate / gate` commit status are REQUIRED
# for keepalive automation to detect CI results. Do not remove or rename them.
#
# SYNC BEHAVIOR:
#   - This file is NOT auto-synced to repos with custom Gate workflows
#   - Repos in CUSTOM_GATE_REPOS list in maint-68-sync-consumer-repos.yml
#     maintain their own Gate and should update manually if needed
#
# Copy this file to: .github/workflows/pr-00-gate.yml
#
# Required secrets: None (uses GITHUB_TOKEN)
# Optional secrets: Passed via `secrets: inherit` to reusable workflow
#
# Examples of custom Gates based on this template:
#   - stranske/trip-planner (Flask + requirements.txt)
#   - stranske/Manager-Database (FastAPI + docker-compose)
# -----------------------------------------------------------------------------

name: Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref_name }}-gate
  cancel-in-progress: true

jobs:
  detect:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      is_python_code: ${{ steps.classify.outputs.is-python-code || 'true' }}
      is_workflow_change: ${{ steps.classify.outputs.is-workflow-change || 'false' }}
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      classification_rationale: ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify:full') || github.event_name == 'schedule' }}

  python-ci:
    name: Python CI
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    uses: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main
    with:
      python-versions: '["3.12", "3.13"]'
      # PR Gate is optimized for fast feedback. Full coverage enforcement runs on main.
      # Coverage measurement was OFF on the Gate while ci.yml has had `coverage: true` all
      # along, and this repo's own ci.yml payload measures 87.48% over 10,805 statements. The
      # Gate's `false` was never a decision: it traces to the M0-001 scaffolding commit that
      # created this workflow, so it is template default rather than judgement.
      coverage: true
      format_check: false  # Using ruff for formatting
      # Keep PR feedback fast by skipping heavy integration suites here.
      # Full test coverage remains enforced on main branch CI.
      pytest_markers: "not release and not slow"
      pytest_args: "-n auto --dist load --ignore=tests/integration --ignore=tests/integrations"
      working-directory: "."
      artifact-prefix: "gate-"
      # Report-only. coverage_trend.py runs with --soft and always exits 0, so this cannot
      # fail a PR. Sequenced AFTER the repaired reporter reached this repo (verified: main's
      # tools/coverage_trend.py carries BASELINE_KEYS and _resolve_baseline) -- before that,
      # an absent baseline rendered as 0.00% and every run showed a large fake improvement.
      # Matches ci.yml's 80 so the two surfaces cannot disagree about the same repo; without
      # it the Gate silently falls back to the reusable workflow's default of 70. Measured
      # 87.48%, so this reports a pass rather than arriving red.
      coverage-min: '80'
      enable-soft-gate: true
    secrets: inherit

  compose-smoke:
    name: Compose smoke
    needs: detect
    permissions:
      contents: read
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install project test dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Docker Compose startup smoke
        env:
          LMS_RUN_COMPOSE_SMOKE: "1"
        run: uv run pytest tests/test_compose_smoke.py -q --no-cov

  fork-status-replay:
    name: Fork status deliberate-break replay
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install test dependencies
        run: uv sync --extra dev

      - name: Capture deliberate break and exact restoration
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/issue-737
        run: |
          set -euo pipefail
          workflow=.github/workflows/pr-00-gate.yml
          test_file=tests/test_gate_commit_status_fork_tolerance.py
          mkdir -p "$EVIDENCE"

          git diff --exit-code HEAD -- "$workflow" "$test_file"
          cp "$workflow" "$EVIDENCE/original.yml"

          restore() {
            cp "$EVIDENCE/original.yml" "$workflow" &&
              cmp "$EVIDENCE/original.yml" "$workflow"
          }
          cleanup() {
            rc=$?
            trap - EXIT
            restore || rc=1
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          {
            git rev-parse HEAD
            printf 'run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '%s\n' \
              'uv run pytest tests/test_gate_commit_status_fork_tolerance.py -q --no-cov'
          } > "$EVIDENCE/metadata.txt"

          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-00-gate.yml")
          original = path.read_bytes()
          old = (
              b"const readOnlyForkToken =\n"
              b"                error?.status === 403 && isForkPullRequest && !hitRateLimit;"
          )
          new = b"const readOnlyForkToken = false;"
          if original.count(old) != 1:
              raise SystemExit("Expected exactly one production expression")
          path.write_bytes(original.replace(old, new, 1))
          PY

          git diff -- "$workflow" > "$EVIDENCE/mutation.diff"

          red=0
          uv run pytest tests/test_gate_commit_status_fork_tolerance.py -q --no-cov \
            > "$EVIDENCE/red.log" 2>&1 || red=$?
          printf '%s\n' "$red" > "$EVIDENCE/red.exit"
          cat "$EVIDENCE/red.log"

          restore
          git diff --exit-code HEAD -- "$workflow" "$test_file" \
            > "$EVIDENCE/restoration.diff"

          green=0
          uv run pytest tests/test_gate_commit_status_fork_tolerance.py -q --no-cov \
            > "$EVIDENCE/green.log" 2>&1 || green=$?
          printf '%s\n' "$green" > "$EVIDENCE/green.exit"
          cat "$EVIDENCE/green.log"

          git diff --exit-code HEAD -- "$workflow" "$test_file"
          test "$red" -eq 1
          test "$green" -eq 0
          grep -q 'test_fork_read_only_403' "$EVIDENCE/red.log"
          grep -q 'test_deleted_fork_read_only_403' "$EVIDENCE/red.log"

      - name: Preserve replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-737-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-737/
          if-no-files-found: error
          retention-days: 90

  summary:
    name: gate-summary
    needs: [detect, python-ci, compose-smoke, fork-status-replay]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      state: ${{ steps.summarize.outputs.state }}
      description: ${{ steps.summarize.outputs.description }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Summarize results
        id: summarize
        env:
          DETECT_RESULT: ${{ needs.detect.result || 'skipped' }}
          PYTHON_RESULT: ${{ needs.python-ci.result || 'skipped' }}
          COMPOSE_SMOKE_RESULT: ${{ needs.compose-smoke.result || 'skipped' }}
          FORK_REPLAY_RESULT: ${{ needs.fork-status-replay.result || 'skipped' }}
        run: |
          set -euo pipefail

          python_result="${PYTHON_RESULT:-skipped}"
          compose_smoke_result="${COMPOSE_SMOKE_RESULT:-skipped}"
          state="success"
          description="All checks passed"

          case "$python_result" in
            success)
              state="success"
              description="Python CI passed"
              ;;
            failure)
              state="failure"
              description="Python CI failed"
              ;;
            cancelled)
              state="error"
              description="Python CI was cancelled"
              ;;
            skipped)
              state="success"
              description="Python CI skipped (no relevant changes)"
              ;;
            *)
              state="pending"
              description="Python CI status unknown"
              ;;
          esac

          case "$compose_smoke_result" in
            success|skipped)
              ;;
            failure)
              state="failure"
              description="Compose smoke failed"
              ;;
            cancelled)
              state="error"
              description="Compose smoke was cancelled"
              ;;
            *)
              state="pending"
              description="Compose smoke status unknown"
              ;;
          esac

          detect_result="${DETECT_RESULT:-skipped}"
          if [[ "${detect_result}" != "success" ]]; then
            if [[ "${detect_result}" == "failure" ]]; then
              state="failure"
              description="Path classification failed"
            elif [[ "${detect_result}" == "cancelled" ]]; then
              state="error"
              description="Path classification was cancelled"
            else
              state="pending"
              description="Path classification status unknown"
            fi
          fi

          if [[ "${FORK_REPLAY_RESULT}" != "success" ]]; then
            state="failure"
            description="Fork status replay ${FORK_REPLAY_RESULT}"
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "[Gate] State: ${state}, Description: ${description}"

      - name: Report Gate commit status
        if: ${{ always() }}
        uses: actions/github-script@v9.0.0
        env:
          STATE: ${{ steps.summarize.outputs.state || 'pending' }}
          DESCRIPTION: ${{ steps.summarize.outputs.description || 'Gate status pending' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const rawState = process.env.STATE || 'pending';
            const allowed = new Set(['error', 'failure', 'pending', 'success']);
            const state = allowed.has(rawState) ? rawState : 'pending';
            const rawDescription = process.env.DESCRIPTION || 'Gate status update';
            const description = rawDescription.length > 140 ? `${rawDescription.slice(0, 137)}...` : rawDescription;
            const targetUrl = process.env.TARGET_URL;

            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: 'Gate / gate',
                description,
                target_url: targetUrl,
              });
              console.log(`Created commit status: ${state} - ${description}`);
            } catch (error) {
              const responseHeaders = error?.response?.headers || {};
              const hitRateLimit =
                error?.status === 403 &&
                (/rate limit|abuse/i.test(error?.message || '') ||
                  /rate limit|abuse/i.test(error?.response?.data?.message || '') ||
                  String(responseHeaders['x-ratelimit-remaining']) === '0' ||
                  responseHeaders['retry-after'] != null);
              // Pull requests opened from forks receive a read-only token, so the
              // status write is refused even after Gate has computed its verdict.
              // Keep same-repository permission failures loud and preserve the
              // existing rate-limit path.
              const pullRequest = context.payload.pull_request;
              const headRepoObject = pullRequest?.head?.repo;
              const headRepo = headRepoObject?.full_name;
              const baseRepo = pullRequest?.base?.repo?.full_name;
              const isForkPullRequest = Boolean(
                baseRepo &&
                  (headRepoObject === null || (headRepo && headRepo !== baseRepo)),
              );
              const readOnlyForkToken =
                error?.status === 403 && isForkPullRequest && !hitRateLimit;
              if (hitRateLimit) {
                core.warning('Rate limit prevented Gate from updating the commit status.');
                if (state !== 'success') {
                  core.setFailed(
                    `Gate verdict for ${sha} is '${state}': ${description}`,
                  );
                }
              } else if (readOnlyForkToken) {
                core.warning(
                  'Fork pull request from ' +
                    `${headRepo ?? pullRequest?.head?.label ?? 'deleted source repository'}: ` +
                    'the workflow token is ' +
                    "read-only, so the 'Gate / gate' commit status could not be " +
                    `written (${error.message}). Gate verdict for ${sha} is ` +
                    `'${state}': ${description}.`,
                );
                await core.summary
                  .addHeading('Gate verdict (fork pull request)', 3)
                  .addRaw(
                    'The `Gate / gate` commit status could not be written for ' +
                      `\`${sha}\` because a pull request from a fork receives a ` +
                      `read-only token. Gate verdict: **${state}** — ${description}`,
                  )
                  .write();
                if (state !== 'success') {
                  core.setFailed(
                    `Gate verdict for ${sha} is '${state}': ${description}`,
                  );
                }
              } else {
                throw error;
              }
            }

      - name: Enforce Gate success
        if: ${{ steps.summarize.outputs.state == 'failure' }}
        run: |
          echo "Gate reported failure: ${{ steps.summarize.outputs.description }}" >&2
          exit 1
